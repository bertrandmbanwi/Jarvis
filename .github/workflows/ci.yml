name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-ci.lock

      - name: Compile
        run: python -m compileall -q jarvis tests scripts

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy jarvis

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Tool contracts
        run: python scripts/check_tool_contracts.py

      - name: Offline evals
        run: python scripts/run_evals.py --offline

      - name: Bandit
        run: python -m bandit -q -r jarvis

  backend-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-ci.lock

      - name: Unit tests (Linux)
        run: python -m pytest tests -q --ignore=tests/e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Start the API and wait for it to answer
        run: |
          docker compose up -d api
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8741/health/ping >/dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          docker compose logs api
          exit 1

      - name: Remote clients need the PIN
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8741/costs)
          test "$code" = "401" -o "$code" = "403"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis/ui/jarvis-ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: jarvis/ui/jarvis-ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: jarvis/ui/jarvis-ui/package-lock.json

      - name: Install backend and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m playwright install --with-deps chromium

      - name: Install frontend dependencies
        working-directory: jarvis/ui/jarvis-ui
        run: npm ci

      - name: Start UI
        working-directory: jarvis/ui/jarvis-ui
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/jarvis-next.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/jarvis-next.log
          exit 1

      - name: Playwright smoke tests
        env:
          JARVIS_E2E_BASE_URL: http://127.0.0.1:3000
        run: python -m pytest tests/e2e -q
